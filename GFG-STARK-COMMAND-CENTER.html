  function submitLocal(form, button) {
    if (!form || !form.reportValidity()) return;

      ? new SubmitEvent('submit', { bubbles: true, cancelable: true, submitter: button || null })

    form.dispatchEvent(event);
  }
  document.addEventListener('click', (event) => {
    const button = event.target.closest?.('button, input[type=submit]');
    if (!button || button.disabled || button.type !== 'submit' || !button.form) return;
    event.preventDefault();
    submitLocal(button.form, button);
  }, true);
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' || event.isComposing || event.defaultPrevented) return;

    if (button?.disabled) { event.preventDefault(); return; }
    event.preventDefault();
    submitLocal(input.form, button);
  }, true);
})();
